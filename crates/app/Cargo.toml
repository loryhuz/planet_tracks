[package]
name = "app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mars-racer"
path = "src/main.rs"

[dependencies]
track.workspace = true
physics.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu = "30"
winit = "0.30.13"
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.36", features = ["winit"] }
gilrs = "0.11"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
cpal = "0.18"
png = "0.18"

# The menu's video background, decoded by the system (AVFoundation) on Apple platforms.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSArray", "NSError", "NSObject"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBase", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFNumber", "CFDictionary"] }
